# Publie l'app Room Defense Coach (racine du dépôt) sur GitHub Pages.
# Réglage requis une fois : Settings › Pages › Source : « GitHub Actions ».
name: Publier l'app Knock Knock sur Pages

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du moteur
        run: npm test
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest \
                sw.js icon.svg icons js vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
