<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Knock Knock Manager</title>
  <meta name="description" content="Coach de progression pour Knock Knock: Room Defense : équipe, artefacts, skins, boss et options payantes.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KK Manager">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barre-haut" id="barre-haut">
    <div class="barre-haut-int"><span class="petit-titre" id="petit-titre"></span><div id="actions-haut" style="display:flex;position:absolute;right:-8px;top:0"></div></div>
  </header>

  <main id="vue"></main>

  <nav class="onglets" aria-label="Sections">
    <div class="onglets-int">
      <button data-onglet="accueil" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/></svg>Accueil</button>
      <button data-onglet="heros"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M3 19c.8-3.2 3.1-5 6-5s5.2 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c2.6-.3 4.7 1.2 5.5 4.3"/></svg>Héros</button>
      <button data-onglet="strategie"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/></svg>Stratégie<span class="compteur" id="compteur-strategie" hidden></span></button>
      <button data-onglet="boss"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.4 0 7.5 3 7.5 7.2 0 2.6-1.3 4.3-3 5.3V19h-9v-3.5c-1.7-1-3-2.7-3-5.3C4.5 6 7.6 3 12 3z"/><circle cx="9.3" cy="10.5" r="1.4"/><circle cx="14.7" cy="10.5" r="1.4"/><path d="M10.5 19v-2M13.5 19v-2"/></svg>Boss</button>
      <button data-onglet="boutique"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Boutique</button>
    </div>
  </nav>

  <div id="feuille"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
